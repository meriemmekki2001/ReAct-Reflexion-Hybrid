[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "react-reflexion-benchmarks"
version = "0.1.0"
description = "LangChain comparison of standalone LLM, ReAct, Reflexion, and ReAct–Reflexion on HotpotQA and GSM8K"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "langchain-core>=0.3,<2",
  "langchain-openai>=0.3,<2",
  "datasets>=3,<5",
  "rank-bm25>=0.2.2,<1",
  "pandas>=2,<3",
  "tqdm>=4,<5",
  "python-dotenv>=1,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
agent-bench = "agent_bench.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
